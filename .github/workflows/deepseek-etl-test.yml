name: Qwen Analysis Button Test

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Public-domain business-intel query to test"
        required: true
        default: "social media marketing trends"
      mode:
        description: "Run mode"
        required: true
        default: "offline"
        type: choice
        options:
          - offline
          - live

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  qwen-analysis-test:
    name: Run Qwen analysis test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic preprocessing and Qwen analysis harness
        env:
          TEST_QUERY: ${{ inputs.query }}
          TEST_MODE: ${{ inputs.mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: |
          python scripts/run_qwen_etl_test.py

      - name: Upload Qwen analysis test artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-analysis-test-output
          path: artifacts/qwen_analysis_test_output.json
          if-no-files-found: error
